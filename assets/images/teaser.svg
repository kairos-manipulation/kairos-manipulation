<svg width="1100" height="460" viewBox="0 0 1100 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="460" rx="28" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="550" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0F172A">KAIROS Pipeline</text>
  <text x="550" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Initial image → semantic keyframes → long video → future latent → robot action</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="155" height="110" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="132.5" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">🖼️</text>
    <text x="132.5" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Init Image</text>
    <text x="132.5" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">+ command</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="255" y="145" width="155" height="110" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="332.5" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">📍</text>
    <text x="332.5" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Keyframes</text>
    <text x="332.5" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">4–6 anchors</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="145" width="155" height="110" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="532.5" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">🎞️</text>
    <text x="532.5" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Video Model</text>
    <text x="532.5" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">~81 frames</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="145" width="155" height="110" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="732.5" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">📦</text>
    <text x="732.5" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Future Latent</text>
    <text x="732.5" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">compressed video</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="855" y="145" width="155" height="110" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="932.5" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28">🤖</text>
    <text x="932.5" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Action Model</text>
    <text x="932.5" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">robot control</text>
  </g>

  <path d="M215 200H250" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M415 200H450" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M615 200H650" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M815 200H850" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>

  <g>
    <rect x="190" y="320" width="720" height="64" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="550" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Core claim</text>
    <text x="550" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Keyframe anchors reduce long-horizon drift and provide better future dynamics for manipulation.</text>
  </g>
</svg>
